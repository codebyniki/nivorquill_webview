name: Validate package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter: ['3.41.0', '']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test
      - run: flutter analyze
      - run: flutter test --coverage
  native-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=ios,android --project-name=nivorquill_example .
        working-directory: example
      - run: flutter build apk --debug
        if: runner.os == 'Linux'
        working-directory: example
      - run: flutter build ios --simulator --debug --no-codesign
        if: runner.os == 'macOS'
        working-directory: example

